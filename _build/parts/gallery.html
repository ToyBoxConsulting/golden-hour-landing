    <div class="g-lb" id="g-lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <button class="x" type="button" aria-label="Close" onclick="ghuGalClose()">&#10005;</button>
      <button class="p" type="button" aria-label="Previous photo" onclick="ghuGalOpen(ghuGal.i-1)">&#8249;</button>
      <button class="n" type="button" aria-label="Next photo" onclick="ghuGalOpen(ghuGal.i+1)">&#8250;</button>
      <figure><img src="" alt=""><figcaption></figcaption></figure>
    </div>
    <script>
      var ghuGal={i:0,items:[],expanded:false};
      function ghuGalSync(){
        var g=document.getElementById('g-grid'); if(!g) return;
        ghuGal.items=[].slice.call(g.querySelectorAll('.g-item:not(.pending) img'));
        var sec=document.getElementById('gallery');
        var on=ghuGal.items.length>0;
        if(sec) sec.style.display=on?'':'none';
        var nl=document.querySelector('.nav-links a[href="#gallery"]'); if(nl) nl.style.display=on?'':'none';
        var more=document.getElementById('g-more'); if(more) more.style.display=(!ghuGal.expanded && ghuGal.items.length>12)?'':'none';
      }
      function ghuGalOpen(n){
        ghuGal.i=(n+ghuGal.items.length)%ghuGal.items.length;
        var im=ghuGal.items[ghuGal.i];
        var lb=document.getElementById('g-lb');
        lb.querySelector('img').src=im.src; lb.querySelector('img').alt=im.alt;
        lb.querySelector('figcaption').textContent=im.alt;
        lb.classList.add('open'); document.body.style.overflow='hidden';
        lb.querySelector('.x').focus();
      }
      function ghuGalClose(){var lb=document.getElementById('g-lb');lb.classList.remove('open');document.body.style.overflow='';}
      (function(){
        var g=document.getElementById('g-grid'); if(!g) return;
        g.addEventListener('click',function(e){
          var b=e.target.closest('.g-btn'); if(!b) return;
          var im=b.querySelector('img'); ghuGalOpen(ghuGal.items.indexOf(im));
        });
        var more=document.getElementById('g-more');
        if(more) more.querySelector('button').addEventListener('click',function(){
          ghuGal.expanded=true; g.classList.remove('collapsed'); more.style.display='none'; ghuGalSync();
        });
        document.addEventListener('keydown',function(e){
          var lb=document.getElementById('g-lb'); if(!lb||!lb.classList.contains('open'))return;
          if(e.key==='Escape')ghuGalClose();
          if(e.key==='ArrowRight')ghuGalOpen(ghuGal.i+1);
          if(e.key==='ArrowLeft')ghuGalOpen(ghuGal.i-1);
        });
        window.addEventListener('load',ghuGalSync); ghuGalSync();
      })();
    </script>
    <p class="rec-credit">Photography by Erik &ldquo;Kaligraphy&rdquo; Wilson, Co-Founder, Converge Media.</p>
