<script>
(function(){
  // 1. Audience tab switcher
  var tabs = document.querySelectorAll('.audience-tab');
  var panels = document.querySelectorAll('.audience-panel');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      var target = tab.getAttribute('data-tab');
      tabs.forEach(function(t){
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      panels.forEach(function(p){ p.classList.remove('active'); });
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      var matched = document.querySelector('.audience-panel[data-panel="' + target + '"]');
      if (matched) matched.classList.add('active');
    });
  });

  // 2. FAQ accordion — click .faq-q to toggle .open on parent .faq-item
  var faqButtons = document.querySelectorAll('.faq-q');
  faqButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var item = btn.closest('.faq-item');
      if (!item) return;
      var isOpen = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  });
})();
</script>
