# GitHub Pages: ensure .well-known directory is included in build output
# so /.well-known/security.txt (RFC 9116) and any future well-known files
# (like assetlinks.json, apple-app-site-association) are served.
include:
  - ".well-known"

# _build/ holds the page sources and the builder script. It is not served.
# (Jekyll already skips underscore-prefixed directories; this is explicit.)
exclude:
  - "_build"
  - "index.nocss.html"
